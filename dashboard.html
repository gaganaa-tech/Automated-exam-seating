<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="/static/css/global.css" />
    <link rel="stylesheet" href="/static/css/dashboard.css" />
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">SeatingSystem</div>
            <nav>
                <a class="active" href="/dashboard">Dashboard</a>
                <a href="/students">Students</a>
                <a href="/teachers">Teachers</a>
                <a href="/rooms">Rooms</a>
                <a href="/subjects">Subjects</a>
                <a href="/exams">Exams</a>
                <a href="/timetable">Timetable</a>
                <a href="/seating">Seating</a>
                <a href="/attendance">Attendance</a>
                <a href="/reports">Reports</a>
                <a href="/notifications">Notifications</a>
                <a href="/settings">Settings</a>
            </nav>
        </aside>
        <main class="content">
            <div class="topbar">
                <h2>Admin Dashboard</h2>
                <div class="topbar-right">
                    <button class="secondary-btn" onclick="setTheme(!document.body.classList.contains('dark-mode'))">Dark Mode</button>
                    <span data-user-name></span>
                    <button class="primary-btn" onclick="logoutUser()">Logout</button>
                </div>
            </div>

            <div class="card-grid" id="stats-grid"></div>
            <div class="row" style="margin-top: 24px;">
                <section class="card" style="flex: 1 1 380px; min-width: 260px;">
                    <h3>Recent Exams</h3>
                    <div id="recent-exams"></div>
                </section>
                <section class="card" style="flex: 1 1 380px; min-width: 260px;">
                    <h3>Recent Activity</h3>
                    <div id="recent-activity"></div>
                </section>
            </div>
        </main>
    </div>
    <div id="toast-container"></div>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/common.js"></script>
    <script>
        async function loadDashboard() {
            try {
                const response = await apiRequest('/api/dashboard');
                const stats = response.stats || {};
                const statCards = [
                    ['Total Students', stats.total_students || 0],
                    ['Total Teachers', stats.total_teachers || 0],
                    ['Total Rooms', stats.total_rooms || 0],
                    ['Total Seats', stats.total_seats || 0],
                    ['Available Seats', stats.available_seats || 0],
                    ['Upcoming Exams', stats.upcoming_exams || 0],
                    ['Published Arrangements', stats.published_arrangements || 0],
                    ['Attendance %', (stats.attendance_percentage || 0) + '%'],
                ];
                document.getElementById('stats-grid').innerHTML = statCards.map(([label, value]) => `
                    <div class="card stat-card">
                        <div class="label">${label}</div>
                        <div class="value">${value}</div>
                    </div>
                `).join('');

                document.getElementById('recent-exams').innerHTML = (response.recent_exams || []).map((exam) => `
                    <div class="list-item">
                        <strong>${exam.name}</strong><br>
                        <small>${exam.exam_code} • ${exam.date_value}</small>
                    </div>
                `).join('');

                document.getElementById('recent-activity').innerHTML = (response.recent_activity || []).map((entry) => `
                    <div class="list-item">
                        <strong>${entry.action}</strong><br>
                        <small>${entry.description}</small>
                    </div>
                `).join('');
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        async function logoutUser() {
            try {
                await apiRequest('/api/auth/logout', { method: 'POST' });
                window.location.href = '/login';
            } catch (error) {
                showToast('Logout failed', 'error');
            }
        }

        checkAuth();
        loadDashboard();
    </script>
</body>
</html>
