<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exams</title>
    <link rel="stylesheet" href="/static/css/global.css" />
    <link rel="stylesheet" href="/static/css/tables.css" />
    <link rel="stylesheet" href="/static/css/forms.css" />
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar"><div class="brand">SeatingSystem</div><nav><a href="/dashboard">Dashboard</a><a href="/students">Students</a><a href="/teachers">Teachers</a><a href="/rooms">Rooms</a><a href="/subjects">Subjects</a><a class="active" href="/exams">Exams</a><a href="/timetable">Timetable</a><a href="/seating">Seating</a><a href="/attendance">Attendance</a><a href="/reports">Reports</a><a href="/notifications">Notifications</a><a href="/settings">Settings</a></nav></aside>
        <main class="content"><div class="topbar"><h2>Exam Management</h2><div class="topbar-right"><button class="secondary-btn" onclick="setTheme(!document.body.classList.contains('dark-mode'))">Dark Mode</button><button class="primary-btn" onclick="logoutUser()">Logout</button></div></div>
            <section class="card"><h3>Create Exam</h3><form id="exam-form" class="form-panel"><input type="text" name="name" placeholder="Exam name" required /><input type="text" name="exam_code" placeholder="Exam code" required /><input type="number" name="subject_id" placeholder="Subject ID" required /><input type="date" name="date_value" required /><input type="time" name="start_time" required /><input type="time" name="end_time" required /><input type="number" name="student_count" placeholder="Student count" value="20" /><div class="form-actions wide"><button type="submit" class="primary-btn">Create Exam</button></div></form></section>
            <section class="card" style="margin-top: 24px;"><h3>Exams</h3><div class="table-wrap"><table><thead><tr><th>Exam</th><th>Code</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead><tbody id="exams-body"></tbody></table></div></section>
        </main>
    </div>
    <div id="toast-container"></div>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/common.js"></script>
    <script>
        async function loadExams() {
            try {
                const response = await apiRequest('/api/exams');
                document.getElementById('exams-body').innerHTML = (response.exams || []).map((exam) => `
                    <tr><td>${exam.name}</td><td>${exam.exam_code}</td><td>${exam.date_value}</td><td><span class="badge success">${exam.status}</span></td><td><button class="secondary-btn" onclick="deleteExam(${exam.id})">Delete</button></td></tr>
                `).join('');
            } catch (error) { showToast(error.message, 'error'); }
        }
        document.getElementById('exam-form').addEventListener('submit', async (event) => { event.preventDefault(); const payload = Object.fromEntries(new FormData(event.target).entries()); try { await apiRequest('/api/exams', { method: 'POST', body: payload }); event.target.reset(); loadExams(); showToast('Exam created.', 'success'); } catch (error) { showToast(error.message, 'error'); } });
        async function deleteExam(id) { try { await apiRequest(`/api/exams/${id}`, { method: 'DELETE' }); loadExams(); showToast('Exam deleted.', 'success'); } catch (error) { showToast(error.message, 'error'); } }
        async function logoutUser() { try { await apiRequest('/api/auth/logout', { method: 'POST' }); window.location.href = '/login'; } catch (error) { showToast('Logout failed', 'error'); } }
        checkAuth();
        loadExams();
    </script>
</body>
</html>
